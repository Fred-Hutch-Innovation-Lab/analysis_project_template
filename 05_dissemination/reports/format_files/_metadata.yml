project:
  output-dir: 05_dissemination/reports
author: Derrik Gratz<br>FHIL
date: last-modified
date-format: "DD MMM YYYY"
code-tools: false
format:
  html:
    code-links: repo
    theme: litera
    embed-resources: true
    comments:
      hypothesis: false
    toc: true
    toc-depth: 1
    toc-expand: 2
    number-depth: 1
    number-sections: false
    toc-title: Sections
    code-fold: false
    link-external-newwindow: true

execute:
  warning: false
  echo: false
figures:
  fig-dpi: 150